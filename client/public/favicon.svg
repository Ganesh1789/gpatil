<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#06080f"/>

  <!-- Gradient badge -->
  <rect x="8" y="8" width="84" height="84" rx="16" ry="16" fill="url(#grad)"/>

  <!-- GP text -->
  <text
    x="50"
    y="68"
    text-anchor="middle"
    font-family="'Arial Black', 'Plus Jakarta Sans', Arial, sans-serif"
    font-weight="900"
    font-size="42"
    fill="white"
    letter-spacing="-1"
  >GP</text>
</svg>